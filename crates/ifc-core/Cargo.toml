[package]
name = "ifc-core"
version = "0.1.0"
edition = "2021"
description = "Streaming-IFC-Leser und Mengenauszug für Sprinkleranlagen"

[dependencies]
memmap2 = "0.9"
memchr = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = "0.79"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "ifc-takeoff"
path = "src/bin/ifc-takeoff.rs"
