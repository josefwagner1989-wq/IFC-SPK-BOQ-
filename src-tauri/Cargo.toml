[package]
name = "spk-ifc-viewer"
version = "0.1.0"
edition = "2021"
description = "IFC Sprinkler Viewer – Mengenauszug für den Vertrieb"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ifc-core = { path = "../crates/ifc-core" }
